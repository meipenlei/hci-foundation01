name: Preparation DCRs

on:
  workflow_dispatch:
    inputs:
      timeoutInMinutes:
        description: 'Timeout in minutes'
        type: string
        default: '60'
      ROVER_IMAGE:
        description: 'Image for Rover'
        type: string
        required: true
        default: 'meipenleikap/dt1aztfmod:1.12.2-2506.2617'

permissions:
  id-token: write
  contents: read

jobs:
  preparation:
    name: Preparation
    runs-on: [self-hosted, hci01, DEV]
    environment: credentials
    timeout-minutes: ${{ fromJSON(inputs.timeoutInMinutes) }}
    container:
      image: ${{ inputs.ROVER_IMAGE }}
      options: --user 0:0

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Verify az CLI inside container
        run: az version

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create Basic DCR
        run: |
          az account set --subscription f371e124-4b06-46ea-9d63-f51d48d76e64
          az deployment group create \
            --name BasicMonitoringDeployment \
            --resource-group 'hci01-rg-mgmt' \
            --template-file configuration/dev/DCR/Basic/basicMonitoring.json \
            --parameters configuration/dev/DCR/Basic/parameters.json

      - name: Create CT DCR
        run: |
          az account set --subscription f371e124-4b06-46ea-9d63-f51d48d76e64
          az deployment group create \
            --name CTMonitoringDeployment \
            --resource-group 'hci01-rg-mgmt' \
            --template-file configuration/dev/DCR/CT/CTMonitoring.json \
            --parameters configuration/dev/DCR/CT/parameters.json
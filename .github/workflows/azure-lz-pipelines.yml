name: Landingzone
run-name: "${{ github.workflow }}(${{ inputs.terraformAction }} -> ${{ inputs.lz }})"

on:
    workflow_dispatch:
        inputs:
            timeoutInMinutes:
                description: 'Timeout in minutes'
                type: string
                required: true
                default: '90'
            parallelism:
                description: 'Terraform parallelism'
                required: false
                type: string
                default: '30'
            terraformAction:
                description: 'Terraform "plan" or "destroy"?'
                type: choice
                required: true
                options:
                    - apply
                    - destroy
            lz: 
                description: 'On which level which landingzone?'
                required: true
                type: choice
                options: 
                    # Update these values to match the landing zones in your environment
                    - level1-subscriptions
                    - level1-identity
                    - level1-management
                    - level1-alz-es
                    - level2-connectivity-hub-reg3
                    - level2-spoke1-reg1
                    - level2-spoke2-reg2
                    - level2-dc1-reg1
                    - level2-dc2-reg2
                    - level3-testsa-reg3
                    #- level3-testvm-reg3     
            environment:
                description: 'Environment Name'
                type: choice
                required: true
                default: 'DEV'
                options:
                    - DEV
                    - TEST
                    - PROD
            ROVER_IMAGE:
                description: 'Image for Rover'
                type: string
                required: true
                default: 'meipenleikap/dt1aztfmod:1.12.2-2506.2617'
            isPrivateImage:
                description: 'Is the image private?'
                type: boolean
                required: true
                default: false


permissions:
  id-token: write
  contents: read
  packages: read

env:
    TERRAFORM_ACTION: ${{ inputs.terraformAction == 'apply' && 'plan' || inputs.terraformAction == 'destroy' && 'plan -destroy'  }}


jobs:
    validation-private:
        timeout-minutes: ${{ fromJSON(inputs.timeoutInMinutes) }}
        if: ${{ inputs.isPrivateImage }}
        runs-on: [self-hosted, hci01, DEV]
        environment: ${{ inputs.lz }}
        container:
            image: ${{ inputs.ROVER_IMAGE }}
            credentials:
                username: ${{ github.actor }}
                password: ${{ secrets.PAT_GITHUB_RUNNER }}
            options: --user 0:0
            volumes:
                - ${{ github.workspace }}:/tf/caf
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Check inputs
              run: |
                  echo "------------- input values for rover -------------"
                  echo "lz               = ${{inputs.lz}}"
                  echo "environment      = ${{inputs.environment}}"
                  echo "TERRAFORM_ACTION = ${{env.TERRAFORM_ACTION}}"

            - name: MSI Log in
              run: |
                echo "------------- log in MSI -------------"
                az account clear
                az login --identity --resource-id ${{ vars.MSI_RESOURCE_ID }} || \
                (echo "Specific MSI failed, trying default identity" && az login --identity)

            - name: Execute Rover Plan
              run: |
                echo "------------- Configure Terraform Environment variables -------------"         
                sudo chmod -R 777 /tf/cache
                git config --global --add safe.directory /tf/caf

                ls /tf/caf/${{vars.CONFIGPATH}}
                
                echo "------------- Execute Rover plan -------------"
                /tf/rover/rover.sh \
                  --impersonate-sp-from-keyvault-url ${{ vars.KEYVAULTURL }} \
                  -lz /tf/caf/${{ vars.LANDINGZONEPATH }} \
                  -var-folder /tf/caf/${{ vars.CONFIGPATH }} \
                  -tfstate_subscription_id ${{ vars.TFSTATESUB }} \
                  -target_subscription ${{ vars.TARGETSUB }} \
                  -tfstate ${{ vars.TFSTATE }}.tfstate \
                  -env ${{ inputs.environment }} \
                  -level ${{ vars.LEVEL }} \
                  -parallelism=${{ fromJSON(inputs.parallelism) }} \
                  -p /tf/caf/${{ vars.PLAN }}.tfplan \
                  -a ${{env.TERRAFORM_ACTION}}

            - name: Publish Terraform Plan
              uses: actions/upload-artifact@v4.4.3
              with:
                  name: tfstate
                  path: /tf/caf/${{ vars.PLAN }}.tfplan

    validation-public:
        timeout-minutes: ${{ fromJSON(inputs.timeoutInMinutes) }}
        if: ${{ !inputs.isPrivateImage }}
        runs-on: [self-hosted, hci01, DEV]
        environment: ${{ inputs.lz }}
        container:
            image: ${{ inputs.ROVER_IMAGE }}
            options: --user 0:0
            volumes:
                - ${{ github.workspace }}:/tf/caf
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Check inputs
              run: |
                  echo "------------- input values for rover -------------"
                  echo "lz               = ${{inputs.lz}}"
                  echo "environment      = ${{inputs.environment}}"
                  echo "TERRAFORM_ACTION = ${{env.TERRAFORM_ACTION}}"

            - name: MSI Log in
              run: |
                echo "------------- log in MSI -------------"
                az account clear
                az login --identity --resource-id ${{ vars.MSI_RESOURCE_ID }} || \
                (echo "Specific MSI failed, trying default identity" && az login --identity)

            - name: Execute Rover Plan
              run: |
                echo "------------- Configure Terraform Environment variables -------------"         
                sudo chmod -R 777 /tf/cache
                git config --global --add safe.directory /tf/caf

                ls /tf/caf/${{vars.CONFIGPATH}}
                
                echo "------------- Execute Rover plan -------------"
                /tf/rover/rover.sh \
                  --impersonate-sp-from-keyvault-url ${{ vars.KEYVAULTURL }} \
                  -lz /tf/caf/${{ vars.LANDINGZONEPATH }} \
                  -var-folder /tf/caf/${{ vars.CONFIGPATH }} \
                  -tfstate_subscription_id ${{ vars.TFSTATESUB }} \
                  -target_subscription ${{ vars.TARGETSUB }} \
                  -tfstate ${{ vars.TFSTATE }}.tfstate \
                  -env ${{ inputs.environment }} \
                  -level ${{ vars.LEVEL }} \
                  -parallelism=${{ fromJSON(inputs.parallelism) }} \
                  -p /tf/caf/${{ vars.PLAN }}.tfplan \
                  -a ${{env.TERRAFORM_ACTION}}

            - name: Publish Terraform Plan
              uses: actions/upload-artifact@v4.4.3
              with:
                  name: tfstate
                  path: /tf/caf/${{ vars.PLAN }}.tfplan
                 
    approval:
        timeout-minutes: ${{ fromJSON(inputs.timeoutInMinutes) }}
        runs-on: [self-hosted, hci01, DEV]
        needs: [validation-private, validation-public]
        if: ${{ always() && (needs.validation-private.result == 'success' || needs.validation-public.result == 'success') }}
        environment:
            name: ${{ inputs.environment }}
        steps:
            - name: Only one step
              run: echo "Only one step"

    deployment-private:
        timeout-minutes: ${{ fromJSON(inputs.timeoutInMinutes) }}
        if: ${{ always() && inputs.isPrivateImage && needs.approval.result == 'success' }}
        runs-on: [self-hosted, hci01, DEV]
        needs: [approval]
        environment: ${{ inputs.lz }}
        container:
            image: ${{ inputs.ROVER_IMAGE }}
            credentials:
                username: ${{ github.actor }}
                password: ${{ secrets.PAT_GITHUB_RUNNER }}
            options: --user 0:0
            volumes:
                - ${{ github.workspace }}:/tf/caf   
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            
            - name: Download Terraform Plan
              uses: actions/download-artifact@v4.1.8
              with:
                  name: tfstate
            
            - name: Check inputs 
              run: |
                echo "------------- input values for rover -------------"
                echo "lz               = ${{inputs.lz}}"
                echo "environment      = ${{inputs.environment}}"
                echo "TERRAFORM_ACTION = ${{env.TERRAFORM_ACTION}}"

            - name: MSI Log in
              run:  |
                echo "------------- log in MSI -------------"
                az login --identity --resource-id ${{ vars.MSI_RESOURCE_ID }} || \
                (echo "Specific MSI failed, trying default identity" && az login --identity)

            - name: Execute Rover apply
              run: |
                echo "------------- Configure Terraform Environment variables -------------"                        
                sudo chmod -R 777 /tf/cache
                git config --global --add safe.directory /tf/caf
               
                echo "------------- Execute Rover apply -------------"
                /tf/rover/rover.sh \
                  --impersonate-sp-from-keyvault-url ${{ vars.KEYVAULTURL }} \
                  -lz /tf/caf/${{ vars.LANDINGZONEPATH }} \
                  -var-folder /tf/caf/${{ vars.CONFIGPATH }} \
                  -tfstate_subscription_id ${{ vars.TFSTATESUB }} \
                  -target_subscription ${{ vars.TARGETSUB }} \
                  -tfstate ${{ vars.TFSTATE }}.tfstate \
                  -env ${{ inputs.environment }} \
                  -level ${{ vars.LEVEL }} \
                  -parallelism=${{ fromJSON(inputs.parallelism) }} \
                  -p /tf/caf/${{ vars.PLAN }}.tfplan \
                  -a apply

            - name: deploy Change Tracking only after management deployment
              if: ${{ (inputs.lz == 'level1-management') && (env.TERRAFORM_ACTION == 'plan') }}
              run: |
                bash configuration/dev/DCR/CT/deploy.sh                 
                sleep 10

            - name: deploy DCR only after management deployment
              if: ${{ (inputs.lz == 'level1-management') && (env.TERRAFORM_ACTION == 'plan') }}
              run: |
                bash configuration/dev/DCR/Basic/deploy.sh
                sleep 10

    deployment-public:
      timeout-minutes: ${{ fromJSON(inputs.timeoutInMinutes) }}
      if: ${{ always() && !inputs.isPrivateImage && needs.approval.result == 'success' }}
      runs-on: [self-hosted, hci01, DEV]
      needs: [approval]
      environment: ${{ inputs.lz }}
      container:
          image: ${{ inputs.ROVER_IMAGE }}
          options: --user 0:0
          volumes:
              - ${{ github.workspace }}:/tf/caf 
      steps:
            - name: Checkout
              uses: actions/checkout@v4
            
            - name: Download Terraform Plan
              uses: actions/download-artifact@v4.1.8
              with:
                  name: tfstate
            
            - name: Check inputs 
              run: |
                echo "------------- input values for rover -------------"
                echo "lz               = ${{inputs.lz}}"
                echo "environment      = ${{inputs.environment}}"
                echo "TERRAFORM_ACTION = ${{env.TERRAFORM_ACTION}}"

            - name: MSI Log in
              run:  |
                echo "------------- log in MSI -------------"
                az login --identity --resource-id ${{ vars.MSI_RESOURCE_ID }} || \
                (echo "Specific MSI failed, trying default identity" && az login --identity)

            - name: Execute Rover apply
              run: |
                echo "------------- Configure Terraform Environment variables -------------"                        
                sudo chmod -R 777 /tf/cache
                git config --global --add safe.directory /tf/caf
               
                echo "------------- Execute Rover apply -------------"
                /tf/rover/rover.sh \
                  --impersonate-sp-from-keyvault-url ${{ vars.KEYVAULTURL }} \
                  -lz /tf/caf/${{ vars.LANDINGZONEPATH }} \
                  -var-folder /tf/caf/${{ vars.CONFIGPATH }} \
                  -tfstate_subscription_id ${{ vars.TFSTATESUB }} \
                  -target_subscription ${{ vars.TARGETSUB }} \
                  -tfstate ${{ vars.TFSTATE }}.tfstate \
                  -env ${{ inputs.environment }} \
                  -level ${{ vars.LEVEL }} \
                  -parallelism=${{ fromJSON(inputs.parallelism) }} \
                  -p /tf/caf/${{ vars.PLAN }}.tfplan \
                  -a apply

            - name: deploy Change Tracking only after management deployment
              if: ${{ (inputs.lz == 'level1-management') && (env.TERRAFORM_ACTION == 'plan') }}
              run: |
                bash configuration/dev/DCR/CT/deploy.sh                 
                sleep 10

            - name: deploy DCR only after management deployment
              if: ${{ (inputs.lz == 'level1-management') && (env.TERRAFORM_ACTION == 'plan') }}
              run: |
                bash configuration/dev/DCR/Basic/deploy.sh
                sleep 10